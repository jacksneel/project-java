name: Java CI/CD

on:
  push:
    branches:
      - main
  
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Package
        run: mvn package -DskipTests


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devproject:${{ github.run_number }} \
            .

      - name: Tag Image as Latest
        run: |
          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/devproject:${{ github.run_number }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/devproject:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devproject:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devproject:latest


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devproject:latest

              sudo docker stop devproject || true
              sudo docker rm devproject || true

              sudo docker run -d \
                --name devproject \
                -p 8080:8080 \
                ${{ secrets.DOCKERHUB_USERNAME }}/devproject:latest
