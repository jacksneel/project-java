name: Java CI/CD

on:
  push:
    branches:
      - main
  
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Package
        run: mvn package -DskipTests


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devproject:${{ github.run_number }} \
            .

      - name: Tag Image as Latest
        run: |
          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/devproject:${{ github.run_number }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/devproject:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devproject:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devproject:latest

